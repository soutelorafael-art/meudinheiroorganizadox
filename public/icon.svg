<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Subtle inner background disc for maskable safe margin -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.08" />

  <!-- Premium Wallet & Card Motif -->
  <g filter="url(#shadow)">
    <!-- Credit Card / Financial Badge -->
    <rect x="136" y="150" width="240" height="150" rx="20" fill="url(#cardGrad)" stroke="#34d399" stroke-width="4" stroke-opacity="0.5" />
    <rect x="136" y="185" width="240" height="28" fill="#020617" fill-opacity="0.6" />
    <circle cx="176" cy="255" r="14" fill="#10b981" />
    <circle cx="196" cy="255" r="14" fill="#34d399" fill-opacity="0.75" />
    <rect x="230" y="248" width="90" height="14" rx="7" fill="#64748b" fill-opacity="0.8" />
  </g>

  <!-- Growth upward arrow badge with Dollar / Real sign -->
  <circle cx="340" cy="330" r="54" fill="#10b981" stroke="#ecfdf5" stroke-width="6" />
  <!-- Upward Trend Arrow -->
  <path d="M318 344 L340 314 L362 344 M340 316 L340 354" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
